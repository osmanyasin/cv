<!DOCTYPE html>
<html lang="en" class="bg-white text-zinc-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Name}} - Resume</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="max-w-3xl mx-auto px-6 py-12 font-sans">

<!-- Header -->
<header class="border-b border-zinc-200 pb-6 mb-8 flex justify-between items-start">
    <div>
        <h1 class="text-3xl font-bold tracking-tight">{{.Name}}</h1>
        <p class="text-lg text-zinc-600 mt-1">{{.Title}}</p>
        <p class="text-sm text-zinc-500 mt-2">{{.Location}} • <a href="mailto:{{.Email}}"
                                                                 class="underline">{{.Email}}</a></p>
    </div>
    <div>
        <a href="./resume.pdf"
           class="inline-block bg-zinc-900 text-white text-sm font-medium px-4 py-2 rounded-lg hover:bg-zinc-800 transition">
            Download PDF
        </a>
    </div>
</header>

<!-- Summary -->
<section class="mb-10">
    <h2 class="text-xs font-semibold tracking-wider text-zinc-400 uppercase mb-3">About</h2>
    <p class="text-zinc-700 leading-relaxed">{{.Summary}}</p>
</section>

<!-- Experience -->
<section class="mb-10">
    <h2 class="text-xs font-semibold tracking-wider text-zinc-400 uppercase mb-4">Experience</h2>
    <div class="space-y-6">
        {{range .Experience}}
        <div>
            <div class="flex justify-between items-baseline">
                <h3 class="font-semibold text-zinc-900">{{.Role}} <span class="text-zinc-400 font-normal">at {{.Company}}</span>
                </h3>
                <span class="text-sm text-zinc-500">{{.Period}}</span>
            </div>
            <ul class="list-disc list-inside mt-2 space-y-1 text-zinc-700 text-sm">
                {{range .Highlights}}
                <li>{{.}}</li>
                {{end}}
            </ul>
        </div>
        {{end}}
    </div>
</section>

<!-- Skills -->
<section>
    <h2 class="text-xs font-semibold tracking-wider text-zinc-400 uppercase mb-3">Skills</h2>
    <div class="flex flex-wrap gap-2">
        {{range .Skills}}
        <span class="bg-zinc-100 text-zinc-800 text-xs font-medium px-2.5 py-1 rounded">{{.}}</span>
        {{end}}
    </div>
</section>

</body>
</html>
